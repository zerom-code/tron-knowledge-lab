name: tron-knowledge-lab-python
services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_lab_local}
      POSTGRES_DB: knowledge_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d knowledge_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:${POSTGRES_PASSWORD:-knowledge_lab_local}@db:5432/knowledge_lab
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
